spring.application.name=api
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Drive do Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURAÇÕES DE PERSISTÊNCIA

# Hibernate criar a tabela se ela não existir
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Java está executando (bom para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto: Diz ao Java como o PostgreSQL 16+ do Neon "fala"
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Open in View: Evita avisos chatos de performance no console
spring.jpa.open-in-view=false

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true