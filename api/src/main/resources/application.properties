spring.application.name=api

# Database (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Otimização de RAM: Pool de Conexões HikariCP
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# Otimização de RAM: Limite de Threads do Tomcat
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Desativa JMX (elimina overhead de monitoramento)
spring.jmx.enabled=false

# Otimização de Garbage Collector para container
spring.main.lazy-initialization=true

# Logs enxutos
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=ERROR
logging.level.org.springframework.web=ERROR

# API Resend
RESEND_API_KEY=${RESEND_API_KEY}

# Security and Server
server.port=${PORT:8080}
api.security.token.secret=${JWT_SECRET}
admin.api.key=${ADMIN_KEY}