spring.application.name=api
# Substitua pelos seus dados reais do Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Drive do Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURAÇÕES DE PERSISTÊNCIA (O que estava faltando) ---

# 1. Manda o Hibernate criar a tabela se ela não existir
# Usaremos 'update' para ele apenas atualizar a estrutura sem apagar dados
spring.jpa.hibernate.ddl-auto=update

# 2. Mostra no console o SQL que o Java está executando (bom para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Dialeto: Diz ao Java como o PostgreSQL 16+ do Neon "fala"
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 4. Open in View: Evita avisos chatos de performance no console
spring.jpa.open-in-view=false

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true